# -----------------------------------------------------------------------------
# Claude - AI assistant on GitHub (optional)
#
# Mention @claude in an issue, a pull request or a review comment and Claude
# Code answers, reviews, or pushes commits to a branch / opens a PR.
# It follows AGENTS.md (the project rules for AI assistants).
#
# Setup: add the repository secret ANTHROPIC_API_KEY (or run `/install-github-app`
# from Claude Code). Without the secret, mentions simply fail; nothing else
# is affected. Only users with write access can trigger it.
# -----------------------------------------------------------------------------
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
