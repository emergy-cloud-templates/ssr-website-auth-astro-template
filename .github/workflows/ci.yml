# -----------------------------------------------------------------------------
# CI - quality checks (no AWS access, no secrets)
#
# Runs on pull requests and on main: lint, formatting, type checks, unit
# tests, the packaged-Lambda smoke test, browser end-to-end tests (against the
# Lambda bundle, in local auth mode) and Terraform validation + tests.
# Deployments are handled by build.yml / deploy.yml, which also run the fast
# checks before uploading an artifact.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Lambda bundle smoke test
        run: pnpm test:ssr

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.15.8' }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test (mock providers)
        run: terraform test

      - name: Validate bootstrap stack
        run: terraform -chdir=bootstrap init -backend=false -input=false && terraform -chdir=bootstrap validate
