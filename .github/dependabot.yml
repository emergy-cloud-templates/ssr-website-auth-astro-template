version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
      - website
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      supabase:
        patterns: ["@supabase/*"]
      tooling:
        dependency-type: "development"

  - package-ecosystem: "terraform"
    directory: "/infrastructure"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
      - infrastructure
